name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Test, typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit + invariant tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: E2E tests
        if: ${{ secrets.APEX_E2E_EMAIL != '' && secrets.APEX_E2E_PASS != '' }}
        run: npx playwright test
        env:
          APEX_E2E_EMAIL: ${{ secrets.APEX_E2E_EMAIL }}
          APEX_E2E_PASS: ${{ secrets.APEX_E2E_PASS }}

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://apex.lankdev.my.id
